<!-- Sichtbarkeits-Gate, JS-unabhaengig robust: ohne JS ist alles sichtbar;
     mit JS wird ausgeblendet und per .loaded eingeblendet. Scheitert das
     3D-Modul (kein Importmap-Support, 404, Blocker), schaltet der
     Error-Handler bzw. der Timeout auf den statischen Fallback um. -->
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('js');
  function fallback() {
    if (!root.classList.contains('loaded')) root.classList.add('no-webgl', 'loaded');
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if ((t && t.tagName === 'SCRIPT') || /module|import/i.test(e.message || '')) fallback();
  }, true);
  setTimeout(fallback, 3000);
})();
</script>
